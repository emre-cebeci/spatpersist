name: test-coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Enforce test coverage
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          coverage <- covr::package_coverage(type = c("tests", "examples"))
          percent <- as.numeric(covr::percent_coverage(coverage))
          threshold <- 85

          print(coverage)

          summary_path <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_path)) {
            writeLines(
              c(
                "## Test coverage",
                "",
                sprintf("Package coverage: **%.2f%%**", percent),
                sprintf("Required coverage: **%.2f%%**", threshold)
              ),
              summary_path
            )
          }

          if (!is.finite(percent) || percent < threshold) {
            stop(sprintf(
              "Coverage %.2f%% is below the %.2f%% threshold.",
              percent,
              threshold
            ))
          }
          RSCRIPT
