name: R-CMD-check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: release,  name: 'macOS (release)'}
          - {os: windows-latest, r: release,  name: 'Windows (release)'}
          - {os: ubuntu-latest,  r: devel,    name: 'Ubuntu (devel)'}
          - {os: ubuntu-latest,  r: release,  name: 'Ubuntu (release)'}
          - {os: ubuntu-latest,  r: oldrel-1, name: 'Ubuntu (oldrel-1)'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
