name: Feature request
description: Suggest a general improvement to spatpersist
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the general workflow without attaching private data. Examples must use synthetic or openly licensed public data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What general problem should the package solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interface or result you would find useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any existing workaround or alternative design.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not included private, restricted, unpublished, or personally identifying data.
          required: true
