name: Bug report
description: Report reproducible incorrect behavior in spatpersist
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Use only synthetic or openly licensed public data. Do not attach confidential, restricted, unpublished, or personally identifying data.
  - type: input
    id: version
    attributes:
      label: spatpersist version
      description: Paste the result of `packageVersion("spatpersist")` or the Git commit.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal reproducible example
      description: Provide executable code using synthetic or public data only.
      render: r
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: session
    attributes:
      label: Session information
      description: Paste `sessionInfo()` after removing private paths or metadata.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: I have not included private, restricted, unpublished, or personally identifying data.
          required: true
